[tool.poetry]
name = "msfs24-metashot"
version = "2.0.0"
description = "Screenshot tool for Microsoft Flight Simulator 2024 with geotags and rich metadata"
authors = ["placeholder <placeholder3433475435@placeholder43453.com>"]
readme = "README.md"
license = "AGPL-3.0-or-later"

[tool.poetry.dependencies]
python = "^3.10"
PyQt5 = "^5.15.11"
SimConnect = "^0.6.1"
psutil = "^6.1.0"
pyqtkeybind = "^0.0.8"
tzlocal = "^5.2"
geopy = "^2.4.1"
pathvalidate = "^3.2.1"
pywin32 = "^308"
Pillow = "^11.1.0"
multiexit = "^1.5.1"

[tool.poetry.dev-dependencies]
pytest = "^8.3.4"
black = "^25.1.0"
mypy = "^1.14.1"
flake8 = "^7.1.1"
types-tzlocal = "^5.1.0"
pyinstaller = "^6.12.0"
pip-licenses = "^5.0.0"
types-Markdown = "^3.7.0"
pynsist = "^2.8"
Jinja2 = "^3.1.5"
Markdown = "^3.7.0"
bump2version = "^1.0.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "win32gui",
    "win32process"
]
ignore_errors = true
